name: Canonical Dashboard Validation

on:
  push:
    paths:
      - "patch_canonical_dashboard.py"
      - ".github/workflows/canonical_dashboard_validation.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Apply dashboard patch
        run: python patch_canonical_dashboard.py
      - name: Compile dashboard modules
        run: |
          python -m py_compile coaching_snapshot.py recomposition.py streamlit_app.py
      - name: Commit validated dashboard integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recomposition.py streamlit_app.py
          if ! git diff --cached --quiet; then
            git commit -m "Use canonical coaching snapshot in dashboard"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
