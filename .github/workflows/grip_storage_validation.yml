name: Validate Grip Storage

on:
  push:
    paths:
      - ".github/workflows/grip_storage_validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install database dependency
        run: pip install "psycopg[binary]>=3.2,<4" pandas
      - name: Validate grip table
        env:
          WITHINGS_DATABASE_URL: ${{ secrets.WITHINGS_DATABASE_URL }}
        run: |
          python - <<'PY'
          from grip_data import load_grip_measurements
          frame = load_grip_measurements()
          print(f"Grip storage reachable. Existing rows: {len(frame)}")
          print("Derived columns available:", sorted(set(frame.columns) & {"best_left_kg", "best_right_kg", "avg_left_kg", "avg_right_kg", "asymmetry_pct", "best_overall_kg"}))
          PY
