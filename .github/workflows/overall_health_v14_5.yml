name: Apply overall health trends patch

on:
  push:
    paths:
      - '.github/workflows/overall_health_v14_5.yml'

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard
        run: python tools/patch_overall_health_v14_5.py
      - name: Validate Python syntax
        run: python -m py_compile streamlit_app.py
      - name: Validate goals JSON
        run: python -m json.tool data/fitness_goals.json > /dev/null
      - name: Commit dashboard update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add streamlit_app.py data/fitness_goals.json
          git diff --cached --quiet && exit 0
          git commit -m 'Simplify body composition to overall health trends'
          git push
