name: Apply Withings source-of-truth patch

on:
  push:
    paths:
      - '.github/workflows/withings_source_truth_v15_0.yml'

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard
        run: python tools/patch_withings_source_truth_v15_0.py
      - name: Validate Python syntax
        run: python -m py_compile streamlit_app.py
      - name: Commit dashboard update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m 'Use direct Withings as body source of truth'
          git push
