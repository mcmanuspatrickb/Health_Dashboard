name: Fictional Coaching Snapshot UI Checks

on:
  pull_request:
    paths:
      - coaching_snapshot.py
      - streamlit_app.py
      - test_coaching_snapshot_freshness.py
      - .github/workflows/coaching_snapshot_ui_checks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Minimal offline dependencies
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Fake-snapshot freshness tests
        run: python -m unittest test_coaching_snapshot_freshness.py -v
      - name: Syntax compile dashboard and canonical loader
        run: python -m py_compile streamlit_app.py coaching_snapshot.py
