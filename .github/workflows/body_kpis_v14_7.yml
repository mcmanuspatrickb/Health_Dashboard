name: Apply body KPI patch

on:
  push:
    paths:
      - '.github/workflows/body_kpis_v14_7.yml'

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard
        run: python tools/patch_body_kpis_v14_7.py
      - name: Validate Python syntax
        run: python -m py_compile streamlit_app.py
      - name: Commit dashboard update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m 'Refine overall chart and Withings KPI cards'
          git push
